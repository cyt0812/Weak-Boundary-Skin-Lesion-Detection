  <rect x="613" y="713" width="375" height="96" rx="24" fill="#d6eeeb" stroke="#00968e" stroke-width="4"/>
  <text x="660" y="756" class="body">[R, G, B, Mask]</text>
  <text x="680" y="789" class="sub">4 × 224 × 224</text>
  <text x="80" y="865" class="sub">The four-channel tensor is fed to an adapted MB-DCNN; it is not a visual overlay or ground-truth Mask.</text>
